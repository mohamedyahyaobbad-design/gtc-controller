<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>GTC - Gaming Future</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body,html{
height:100%;
font-family:Arial, Helvetica, sans-serif;
overflow:hidden;
}

/* VIDEO */
#bg-video{
position:fixed;
right:0;
bottom:0;
min-width:100%;
min-height:100%;
z-index:-2;
}

/* DARK OVERLAY */
.overlay-bg{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:-1;
}

/* CONTENT */
.content{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
color:white;
}

/* TITLE */
.content h1{
font-size:70px;
letter-spacing:4px;
color:#00f5ff;
text-shadow:
0 0 10px #00f5ff,
0 0 20px #00f5ff,
0 0 40px #00f5ff;
margin-bottom:20px;
}

/* TEXT */
.content p{
font-size:22px;
margin-bottom:40px;
color:#ddd;
}

/* BUTTON */
.enter-btn{
display:inline-block;
padding:15px 40px;
font-size:20px;
color:#00f5ff;
border:2px solid #00f5ff;
text-decoration:none;
border-radius:30px;
transition:0.3s;
}

/* BUTTON HOVER */
.enter-btn:hover{
background:#00f5ff;
color:black;
box-shadow:
0 0 10px #00f5ff,
0 0 30px #00f5ff;
transform:scale(1.1);
}

</style>
</head>

<body>

<video autoplay muted loop id="bg-video">
<source src="J’ai transformé l’iPad Mini en console portable.mp4" type="video/mp4">
</video>

<div class="overlay-bg"></div>

<div class="content">

<h1>GTC</h1>

<p>NO BUTTONS • NO ERRORS</p>

<a href="accueil.html" class="enter-btn">ENTER GAME</a>

</div>

</body>
</html>
